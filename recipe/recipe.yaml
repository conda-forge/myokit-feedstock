schema_version: 1

context:
  version: "1.41.0"

package:
  name: myokit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/myokit/myokit-${{ version }}.tar.gz
  sha256: bc67aa5d6a62dc7e37b754c34582a72f4162b8f3a01329dac16615516197312d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - myokit = myokit.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - configparser
    - lxml
    - matplotlib-base >=2.2
    - numpy
    - setuptools >=77

tests:
  - python:
      imports:
        - myokit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - myokit --help

about:
  summary: A modeling and simulation tool for cardiac cellular electrophysiology
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt
    - THIRD-PARTY-NOTICES.txt
  homepage: http://myokit.org
  repository: https://github.com/myokit/myokit

extra:
  recipe-maintainers:
    - synapticarbors
    - MichaelClerx
