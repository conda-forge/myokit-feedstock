schema_version: 1

context:
  version: "1.40.0"

package:
  name: myokit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/myokit/myokit-${{ version }}.tar.gz
  sha256: 85d08c8108fd9d05093d732c8184569e900a178a721ecc880a190f29e84ded60

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - myokit = myokit.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - configparser
    - lxml
    - matplotlib-base >=2.2
    - numpy
    - setuptools

tests:
  - python:
      imports:
        - myokit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - myokit --help

about:
  summary: A modeling and simulation tool for cardiac cellular electrophysiology
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt
    - myokit/tests/data/formats/sbml/LICENSE
    - myokit/tests/data/formats/cellml/LICENSE
    - myokit/_bin/sundials-win-vs/LICENSE
  homepage: http://myokit.org
  repository: https://github.com/myokit/myokit

extra:
  recipe-maintainers:
    - synapticarbors
    - MichaelClerx
